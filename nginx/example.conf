# Замените example.com на свой домен.
# Положите сайт в /var/www/site (index.html, style.css, 404.html, robots.txt).

# WebSocket-эндпоинт пропускаем только для настоящего WebSocket-апгрейда.
# Любой другой запрос на этот путь (браузер, сканер) получает обычный 404 сайта.
map $http_upgrade $ws_upgrade {
    default  0;
    websocket 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    root /var/www/site;
    index index.html;
    error_page 404 /404.html;

    # --- WebSocket-бэкенд на 127.0.0.1:10000 ---
    location = /api/v1/status {
        if ($ws_upgrade = 0) { return 404; }

        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # --- Всё остальное — сайт-подложка ---
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
    }

    location ~* \.(css|js|svg|png|jpg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
